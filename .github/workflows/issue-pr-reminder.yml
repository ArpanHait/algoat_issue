name: Issue PR Reminder

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  issue-pr-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const createPrReminderEnabled = true;
            const createPrReminderAfterIssueAssignedDays = 3;
            const createPrReminderBeforeIssueUnassignedDays = 2;
            const unassignIssueAfterDays = 7;
            const createPrReminderAfterIssueAssignedMilliseconds = createPrReminderAfterIssueAssignedDays * 24 * 60 * 60 * 1000;
            const createPrReminderBeforeIssueUnassignedMilliseconds = createPrReminderBeforeIssueUnassignedDays * 24 * 60 * 60 * 1000;
            const unassignIssueAfterMilliseconds = unassignIssueAfterDays * 24 * 60 * 60 * 1000;
            const now = Date.now();

            async function listOpenIssues() {
              const issues = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const issuesResponse = await github.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  page
                });

                issues.push(...issuesResponse.data.filter(i => !i.pull_request));

                hasNextPage = issuesResponse.headers.link && issuesResponse.headers.link.includes('rel="next"');
                page++;
              }

              return issues;
            }

            async function listIssueEvents(issue) {
              const events = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const eventsResponse = await github.rest.issues.listEventsForTimeline({
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                  page
                });

                events.push(...eventsResponse.data);

                hasNextPage = eventsResponse.headers.link && eventsResponse.headers.link.includes('rel="next"');
                page++;
              }

              return events;
            }

            async function listIssueComments(issue) {
              const comments = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const commentsResponse = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                  page
                });

                comments.push(...commentsResponse.data);

                hasNextPage = commentsResponse.headers.link && commentsResponse.headers.link.includes('rel="next"');
                page++;
              }

              return comments;
            }

            async function createPrReminder(assignee, issueNumber, comments, createPrReminderAfter, prReminder) {
              if (now < createPrReminderAfter) {
                return false;
              }

              if (comments.some(comment => comment.body.includes(prReminder.slice(0, 40)))) {
                return false;
              }

              if (createPrReminderEnabled) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: prReminder
                });
              }

              console.log(`Issue #${issueNumber} PR reminder sent to @${assignee.login}`);
              return true;
            }

            async function createPrReminders() {
              const issues = await listOpenIssues();

              for (const issue of issues) {
                if (!issue.assignees || issue.assignees.length === 0) {
                  continue;
                }

                const events = await listIssueEvents(issue);
                const pullRequests = events
                  .filter(event => event.event === 'cross-referenced')
                  .map(event => event.source ? event.source.issue : null)
                  .filter(iss => iss && iss.pull_request);
                const comments = await listIssueComments(issue);

                for (const assignee of issue.assignees) {
                  const assignedEvent = events.slice().reverse().find(event => event.event === 'assigned' && event.assignee && event.assignee.login === assignee.login);
                  if (!assignedEvent) continue;

                  const issueAssignedAt = new Date(assignedEvent.created_at);

                  const assigneePullRequest = pullRequests.find(pr => pr.user && pr.user.login === assignee.login);
                  if (assigneePullRequest) {
                    continue;
                  }

                  // 1. First reminder at 3 days
                  const createFirstPrReminderAfter = new Date(issueAssignedAt.getTime() + createPrReminderAfterIssueAssignedMilliseconds);
                  const firstPrReminder = `Hello @${assignee.login}! 👋\n\nThank you for taking on this issue. We hope your implementation is going well!\n\n**Friendly Reminder:** When you are ready, please open a draft pull request linking this issue. Opening a draft PR early helps maintainers track progress and provide feedback if needed.\n\nIf you have any questions or encounter any blockers, feel free to ask here! 😊`;

                  const isFirstPrReminderCreated = await createPrReminder(assignee, issue.number, comments, createFirstPrReminderAfter, firstPrReminder);
                  if (isFirstPrReminderCreated) {
                    continue;
                  }

                  // 2. Final reminder before unassignment (at day 5)
                  const unassignIssueAfter = new Date(issueAssignedAt.getTime() + unassignIssueAfterMilliseconds);
                  const createFinalPrReminderAfter = new Date(issueAssignedAt.getTime() + unassignIssueAfterMilliseconds - createPrReminderBeforeIssueUnassignedMilliseconds);
                  const finalPrReminder = `Hi @${assignee.login}! 👋\n\nWe wanted to check in on your progress with this issue.\n\n**⏰ Timeline Notice:** If a draft PR is not opened by **${unassignIssueAfter.toLocaleDateString()}** (7 days from assignment), this issue will be automatically unassigned so other contributors can assist.\n\n**Options:**\n- Open a draft PR linking this issue (even if work is in progress)\n- Comment here if you need an extension or have questions\n- Tag a maintainer if you are facing any blockers\n\nThank you for contributing to **Algoat**! 🚀`;

                  await createPrReminder(assignee, issue.number, comments, createFinalPrReminderAfter, finalPrReminder);
                }
              }
            }

            await createPrReminders();
