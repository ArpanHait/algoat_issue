name: PR Review Reminder

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-review-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const createReviewReminderEnabled = true;
            const createReviewReminderAfterPrOpenedDays = 2;
            const createReviewReminderBeforePrClosedDays = 2;
            const closePrAfterDays = 7;
            const createReviewReminderAfterPrOpenedMilliseconds = createReviewReminderAfterPrOpenedDays * 24 * 60 * 60 * 1000;
            const createReviewReminderBeforePrClosedMilliseconds = createReviewReminderBeforePrClosedDays * 24 * 60 * 60 * 1000;
            const closePrAfterMilliseconds = closePrAfterDays * 24 * 60 * 60 * 1000;
            const now = Date.now();

            async function listOpenPrs() {
              const pullRequests = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const pullRequestsResponse = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  page
                });

                pullRequests.push(...pullRequestsResponse.data.filter(pr => !pr.draft));

                hasNextPage = pullRequestsResponse.headers.link && pullRequestsResponse.headers.link.includes('rel="next"');
                page++;
              }

              return pullRequests;
            }

            async function listPrReviews(pullRequest) {
              const reviews = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const reviewsResponse = await github.rest.pulls.listReviews({
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                  per_page: 100,
                  page
                });

                reviews.push(...reviewsResponse.data);

                hasNextPage = reviewsResponse.headers.link && reviewsResponse.headers.link.includes('rel="next"');
                page++;
              }

              return reviews;
            }

            async function listPrComments(pullRequest) {
              const comments = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const issuesResponse = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  per_page: 100,
                  page
                });

                comments.push(...issuesResponse.data);

                hasNextPage = issuesResponse.headers.link && issuesResponse.headers.link.includes('rel="next"');
                page++;
              }

              return comments;
            }

            async function createReviewReminder(user, pullRequestNumber, comments, createReviewReminderAfter, reviewReminder) {
              if (now < createReviewReminderAfter) {
                return false;
              }

              if (comments.some(comment => comment.body.includes(reviewReminder.slice(0, 40)))) {
                return false;
              }

              if (createReviewReminderEnabled) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullRequestNumber,
                  body: reviewReminder
                });
              }

              console.log(`PR #${pullRequestNumber} review reminder created for: @${user.login}`);
              return true;
            }

            async function createReviewReminders() {
              const pullRequests = await listOpenPrs();

              for (const pullRequest of pullRequests) {
                const reviews = await listPrReviews(pullRequest);
                const changesRequestedReviews = reviews.filter(review => review.state === 'CHANGES_REQUESTED');
                if (changesRequestedReviews.length === 0) {
                  continue;
                }

                const comments = await listPrComments(pullRequest);
                const latestReview = changesRequestedReviews[changesRequestedReviews.length - 1];
                const reviewSubmittedAt = new Date(latestReview.submitted_at);

                // First reminder 2 days after changes requested
                const createFirstReviewReminderAfter = new Date(reviewSubmittedAt.getTime() + createReviewReminderAfterPrOpenedMilliseconds);
                const firstReviewReminder = `Hello @${pullRequest.user.login}! 👋\n\nReviewers have requested changes or feedback on this pull request. Please address the feedback or leave a comment if you have questions!`;

                const isFirstReviewReminderCreated = await createReviewReminder(pullRequest.user, pullRequest.number, comments, createFirstReviewReminderAfter, firstReviewReminder);
                if (isFirstReviewReminderCreated) {
                  continue;
                }

                // Final reminder before stale/closure notice
                const createFinalReviewReminderAfter = new Date(reviewSubmittedAt.getTime() + closePrAfterMilliseconds - createReviewReminderBeforePrClosedMilliseconds);
                const finalReviewReminder = `Hi @${pullRequest.user.login}! 👋\n\nFriendly reminder to resolve open review requests on this PR. If you need any assistance or more time, please let maintainers know! 🚀`;

                await createReviewReminder(pullRequest.user, pullRequest.number, comments, createFinalReviewReminderAfter, finalReviewReminder);
              }
            }

            await createReviewReminders();
