name: PR Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  size-label:
    name: Auto Size Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Diff Size and Apply Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // Define size thresholds (total line additions + deletions)
            const sizeMap = [
              { label: 'size: XS', max: 9 },
              { label: 'size: S', max: 49 },
              { label: 'size: M', max: 249 },
              { label: 'size: L', max: 499 },
              { label: 'size: XL', max: 999 },
              { label: 'size: XXL', max: Infinity }
            ];

            const allSizeLabels = sizeMap.map(s => s.label);

            // Fetch changed files to calculate diff size while excluding generated/noise files
            let totalChanges = 0;
            let page = 1;
            let hasNext = true;
            const ignoredExtensions = ['.lock', '.min.js', '.map', '.svg', '.png', '.jpg', '.jpeg', '.gif', '.bin'];

            while (hasNext) {
              const filesResponse = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number,
                per_page: 100,
                page
              });

              for (const file of filesResponse.data) {
                const isIgnored = ignoredExtensions.some(ext => file.filename.endsWith(ext)) ||
                                  file.filename === 'package-lock.json' ||
                                  file.filename === 'conan.lock';
                if (!isIgnored) {
                  totalChanges += file.changes;
                }
              }

              hasNext = filesResponse.headers.link && filesResponse.headers.link.includes('rel="next"');
              page++;
            }

            // Determine target label
            const matched = sizeMap.find(s => totalChanges <= s.max);
            const targetLabel = matched ? matched.label : 'size: XXL';

            // Get current labels on PR
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const currentLabels = pr.labels.map(l => l.name);
            const labelsToRemove = currentLabels.filter(l => allSizeLabels.includes(l) && l !== targetLabel);

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: label
                });
              } catch (err) {
                console.log(`Failed to remove label ${label}:`, err.message);
              }
            }

            if (!currentLabels.includes(targetLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [targetLabel]
              });
              console.log(`Applied label "${targetLabel}" (${totalChanges} changed lines) to PR #${pull_number}`);
            }
