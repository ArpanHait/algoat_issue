name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: "🎉 Thanks for opening your first pull request to **Algoat**! Our maintainers will review your work shortly. Please make sure all CI checks and tests pass in the meantime."
          issue-message: "👋 Welcome to **Algoat** and thank you for opening your first issue! We appreciate you helping us improve the library."
