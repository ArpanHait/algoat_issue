name: Issue Unassign

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  issue-unassign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const unassignIssueEnabled = true;
            const unassignIssueAfterDays = 7;
            const unassignIssueAfterMilliseconds = unassignIssueAfterDays * 24 * 60 * 60 * 1000;
            const now = Date.now();

            async function listOpenIssues() {
              const issues = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const issuesResponse = await github.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  page
                });

                issues.push(...issuesResponse.data.filter(i => !i.pull_request));

                hasNextPage = issuesResponse.headers.link && issuesResponse.headers.link.includes('rel="next"');
                page++;
              }

              return issues;
            }

            async function listIssueEvents(issue) {
              const allEvents = [];
              let page = 1;
              let hasNextPage = true;

              while (hasNextPage) {
                const issuesResponse = await github.rest.issues.listEventsForTimeline({
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                  page
                });

                allEvents.push(...issuesResponse.data);

                hasNextPage = issuesResponse.headers.link && issuesResponse.headers.link.includes('rel="next"');
                page++;
              }

              return allEvents;
            }

            async function unassignIssues() {
              const issues = await listOpenIssues();

              for (const issue of issues) {
                if (!issue.assignees || issue.assignees.length === 0) {
                  continue;
                }

                const events = await listIssueEvents(issue);
                const pullRequests = events
                  .filter(event => event.event === 'cross-referenced')
                  .map(event => event.source ? event.source.issue : null)
                  .filter(iss => iss && iss.pull_request);

                for (const assignee of issue.assignees) {
                  const assigneePullRequest = pullRequests.find(pr => pr.user && pr.user.login === assignee.login);
                  if (assigneePullRequest) {
                    continue;
                  }

                  const assignedEvent = events.slice().reverse().find(event => event.event === 'assigned' && event.assignee && event.assignee.login === assignee.login);
                  if (!assignedEvent) continue;

                  const issueAssignedAt = new Date(assignedEvent.created_at);
                  const unassignIssueAfter = new Date(issueAssignedAt.getTime() + unassignIssueAfterMilliseconds);

                  if (now < unassignIssueAfter) {
                    continue;
                  }

                  if (unassignIssueEnabled) {
                    await github.rest.issues.removeAssignees({
                      owner,
                      repo,
                      issue_number: issue.number,
                      assignees: [assignee.login],
                    });

                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `Hello @${assignee.login}! 👋 This issue has been automatically unassigned due to ${unassignIssueAfterDays} days of inactivity without an open PR. 📅\n\nThis keeps tasks available for the active contributor community. Feel free to comment \`/attempt\` again when you're ready to work on it! Thank you! 😊`,
                    });
                  }

                  console.log(`Issue #${issue.number} unassigned from @${assignee.login}`);
                }
              }
            }

            await unassignIssues();
