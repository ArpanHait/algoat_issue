name: Issue Triage and Area Auto-Labeler

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage-label:
    name: Auto Triage & Area Classifier
    runs-on: ubuntu-latest
    steps:
      - name: Classify and Apply Area / Triage Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const title = (context.payload.issue.title || '').toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const fullText = `${title} ${body}`;

            const labelsToAdd = new Set();

            // Ensure baseline triage label if not already triaged
            const currentLabels = (context.payload.issue.labels || []).map(l => l.name);
            if (!currentLabels.some(l => ['ready-for-agent', 'ready-for-human', 'needs-info', 'wontfix'].includes(l))) {
              labelsToAdd.add('needs-triage');
            }

            // Keyword mapping for area labels
            const areaRules = [
              { label: 'area: python', keywords: ['python', 'nanobind', 'numpy', 'pypi', 'pip install', 'wheel', 'sort_inplace'] },
              { label: 'area: sorting', keywords: ['sort', 'sorting', 'timsort', 'introsort', 'radix', 'blocksort', 'quicksort', 'mergesort', 'heapsort', 'shellsort'] },
              { label: 'area: searching', keywords: ['search', 'searching', 'binarysearch', 'binary search', 'interpolationsearch', 'interpolation search', 'linearsearch'] },
              { label: 'area: numerics', keywords: ['float16', 'half precision', 'morton', 'z-order', 'bmi2', 'avx', 'simd', 'boolean', 'branchless'] },
              { label: 'area: core', keywords: ['dispatch', 'dispatcher', 'datatraits', 'traits', 'algoconfig', 'registry'] },
              { label: 'area: build', keywords: ['cmake', 'cmakepresets', 'conan', 'vcpkg', 'gcc', 'clang', 'msvc', 'compiler warning', 'c++20'] },
              { label: 'area: benchmarks', keywords: ['benchmark', 'google benchmark', 'latency', 'throughput', 'speedup', 'flamegraph', 'ns/op'] },
              { label: 'area: docs', keywords: ['docs', 'documentation', 'readme', 'architecture.md', 'typo', 'doxygen', 'contributing.md'] },
              { label: 'area: ci', keywords: ['github actions', 'ci/cd', 'workflow', 'runner', 'pr-lint', 'release-drafter'] }
            ];

            for (const rule of areaRules) {
              if (rule.keywords.some(kw => fullText.includes(kw))) {
                labelsToAdd.add(rule.label);
              }
            }

            const newLabels = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));

            if (newLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: newLabels
              });
              console.log(`Applied labels ${JSON.stringify(newLabels)} to Issue #${issueNumber}`);
            }
