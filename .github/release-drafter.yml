name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'type: feature'
      - 'feature'
      - 'enhancement'
      - 'feat'

  - title: '💥 Breaking Changes'
    labels:
      - 'type: breaking'
      - 'breaking'
      - 'major'

  - title: '⚡ Performance Optimizations'
    labels:
      - 'type: perf'
      - 'perf'
      - 'performance'
      - 'benchmark'

  - title: '🐛 Bug Fixes'
    labels:
      - 'type: fix'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'hotfix'

  - title: '📖 Documentation'
    labels:
      - 'type: docs'
      - 'docs'
      - 'documentation'

  - title: '🩹 Patches & Maintenance'
    labels:
      - 'type: chore'
      - 'type: patch'
      - 'type: tests'
      - 'chore'
      - 'refactor'
      - 'test'
      - 'ci'

  - title: '📦 Miscellaneous'
    labels:
      - 'type: misc'
      - 'misc'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'type: breaking'
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'type: feature'
      - 'feature'
      - 'enhancement'
      - 'feat'
  patch:
    labels:
      - 'type: fix'
      - 'type: chore'
      - 'type: docs'
      - 'type: bug'
      - 'type: patch'
      - 'type: tests'
      - 'type: perf'
      - 'fix'
      - 'chore'
      - 'docs'
  default: patch

exclude-labels:
  - 'release: skip changelog'

template: |
  ## Changes

  $CHANGES

autolabeler:
  - label: 'type: feature'
    title:
      - '/feat/i'
      - '/feature/i'
      - '/enhancement/i'
      - '/new/i'
    branch:
      - '/^feat\//i'
      - '/^enhance\//i'

  - label: 'type: perf'
    title:
      - '/perf/i'
      - '/benchmark/i'
      - '/speedup/i'
    branch:
      - '/^perf\//i'

  - label: 'type: fix'
    title:
      - '/fix/i'
      - '/hotfix/i'
      - '/bugfix/i'
      - '/patch/i'
      - '/vuln/i'
    branch:
      - '/^fix\//i'
      - '/^hotfix\//i'
      - '/^patch\//i'
      - '/^vuln\//i'

  - label: 'type: docs'
    title:
      - '/doc/i'
      - '/docs/i'
    branch:
      - '/^docs\//i'

  - label: 'type: chore'
    title:
      - '/chore/i'
      - '/refactor/i'
      - '/ci/i'
    branch:
      - '/^chore\//i'
      - '/^refactor\//i'

  - label: 'type: tests'
    title:
      - '/test/i'
      - '/tests/i'
    branch:
      - '/^test\//i'
